<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" role="img" aria-label="Dramaturge">
  <title>Dramaturge</title>
  <!-- Stage: a navy badge, readable on light and dark themes alike. -->
  <rect width="64" height="64" rx="13" fill="#1B3354"/>
  <!-- Stage floor, with a spotlight centre stage -->
  <defs>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B530" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2B530" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M10 52 H54 L58 58 H6 Z" fill="#2A4A73"/>
  <ellipse cx="34" cy="52" rx="15" ry="5" fill="url(#spot)"/>
  <!-- Curtains, drawn back -->
  <path d="M6 12 H24 C21 22 15 30 15 38 C15 44 18 48 21 52 H6 Z" fill="#B8323F"/>
  <path d="M58 12 H40 C43 22 49 30 49 38 C49 44 46 48 43 52 H58 Z" fill="#B8323F"/>
  <path d="M11 13 C12 25 10 36 10 52 M17 13 C17 22 14 30 13 40" stroke="#8E2230" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M53 13 C52 25 54 36 54 52 M47 13 C47 22 50 30 51 40" stroke="#8E2230" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Valance -->
  <path d="M6 7 H58 V14 C55 18 51 18 48.6 14 C46 18 41 18 38.8 14 C36 18 28 18 25.2 14 C23 18 18 18 15.4 14 C13 18 9 18 6 14 Z" fill="#F2B530"/>
  <!-- The cursor, centre stage -->
  <path d="M27 22 L27 46 L32.6 40.6 L36.4 49.2 L40.6 47.4 L36.8 38.9 L44.6 38.6 Z" fill="#FFFFFF" stroke="#0E1F36" stroke-width="2" stroke-linejoin="round"/>
</svg>
